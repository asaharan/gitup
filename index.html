<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>githubstreak: a nicer githubstatus.com</title>
<meta name="description" content="better githubstatus.com. How many days in a row has GitHub been up?">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header><a class="logo" href="./">githubstreak</a>
<a class="gs" href="https://www.githubstatus.com">githubstatus.com &rarr;</a></header>
<main>
<div class="hero" id="hero"></div>
<button class="gb up playtop" id="playTop">Play the guess game</button>
<div class="streaks" id="streaks"></div>
<div id="status"></div>
<div class="stats" id="stats"></div>
<div class="card"><h2 id="tl-title">Last 26 weeks</h2><div id="game"></div></div>
<div class="card"><h2>Recent incidents</h2><ul class="inc" id="incidents"></ul></div>
</main>
<footer><div id="updated"></div><div>Source: <a href="https://www.githubstatus.com/history">githubstatus.com/history</a> · days are UTC · not affiliated with GitHub</div></footer>
<script src="assets/app.js"></script>
</body></html>
